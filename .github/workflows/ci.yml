# Проверки на каждый push в main и на pull request (D-036, п. 2): тесты ядра и
# приложения, Lint, вызовы Java ядра против minSdk, сборка отладочного APK и APK выпуска.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: tools/setup-android-sdk.sh
      - name: Тесты и Lint
        run: ./gradlew --console=plain :core:model:test :app:testDebugUnitTest :app:lintDebug
      - name: Вызовы Java в ядре есть в Android minSdk
        run: python3 tools/check-core-api.py
      - name: Сборка
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleRelease
      - name: Отчёты при сбое
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            core/model/build/reports
