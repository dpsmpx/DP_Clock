# Реальные снимки UI (Robolectric + ScreenshotsTest, D-029).
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: tools/setup-android-sdk.sh
      - name: ScreenshotsTest
        run: |
          ./gradlew --console=plain :app:testDebugUnitTest -Pscreenshots --tests '*ScreenshotsTest*'
      - name: List screenshots
        run: |
          find app/build/screenshots -type f -name '*.png' | sort
          ls -la app/build/screenshots || true
      - uses: actions/upload-artifact@v4
        with:
          name: dp-clock-screenshots
          path: app/build/screenshots
          if-no-files-found: error
