name: Import official AOSP DeskClock reference

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vendor-aosp-deskclock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aosp-deskclock-reference-import
  cancel-in-progress: false

jobs:
  import-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DP_Clock
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Clone the official AOSP source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch main \
            https://android.googlesource.com/platform/packages/apps/DeskClock.git \
            "$RUNNER_TEMP/aosp-deskclock"
          echo "UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/aosp-deskclock" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy the full source tree into /reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference docs/RESEARCH
          # Copy the entire checked-out project, including hidden files,
          # resources, tests, build metadata and notices; omit only Git history.
          rsync -a --delete --exclude='.git' \
            "$RUNNER_TEMP/aosp-deskclock/" reference/

          IMPORTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/RESEARCH/REFERENCE_SNAPSHOT.md <<EOF
          # AOSP DeskClock reference snapshot

          - **Status:** imported by GitHub Actions.
          - **Source repository:** https://android.googlesource.com/platform/packages/apps/DeskClock/
          - **Upstream branch:** `main`
          - **Upstream commit:** `$UPSTREAM_SHA`
          - **Imported at (UTC):** `$IMPORTED_AT`
          - **Destination:** `/reference` in this repository.
          - **Copy semantics:** the full checked-out upstream project tree is copied, including hidden project files, resources, tests, build files and upstream license/notice files. The `.git` directory and commit history are intentionally excluded; the exact source commit is recorded above.

          ## Rules for using this snapshot

          Treat `/reference` as an unmodified upstream baseline. Put DP_Clock-specific code and documentation outside it. To refresh the reference, manually dispatch the `Import official AOSP DeskClock reference` workflow; refresh replaces the contents of `/reference` with the selected upstream `main` snapshot.

          ## Build note

          This is the DeskClock module source tree, not a complete Android platform checkout. Its AOSP build files may rely on the surrounding Android source tree and platform build environment.
          EOF

      - name: Commit the reference snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add reference docs/RESEARCH/REFERENCE_SNAPSHOT.md
          if git diff --cached --quiet; then
            echo "Reference snapshot is already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "vendor: import AOSP DeskClock reference at ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:main
