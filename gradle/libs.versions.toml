# Версии зависимостей и плагинов — только здесь; новая зависимость — со
# строкой в docs/PROVENANCE.md.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
lifecycle = "2.11.0"
room = "2.8.5"
# androidx.sqlite — та же, что у Room: тесты миграций идут на той версии, что в APK
# (исключение для Lint — app/lint.xml).
sqlite = "2.6.2"
camerax = "1.6.2"
zxing = "3.5.4"
junit = "4.13.2"
# Вход Google для Google Tasks (D-031; выбор автора — Google Play services). Закрытая
# библиотека Google по условиям Android SDK: строка в docs/PROVENANCE.md.
play-services-auth = "22.0.0"
# Задачи Google Play services как корутины; та же версия, что kotlinx-coroutines-core в сборке.
coroutines-play-services = "1.9.0"
# Снимки экранов на JVM (D-029): только тесты, в APK не входит.
robolectric = "4.17"
# Образ Android 16 (API 36) для Robolectric 4.17 — его качает Gradle, а не Robolectric в тесте.
robolectric-sdk = "16-robolectric-13921718-i7"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines-play-services" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
